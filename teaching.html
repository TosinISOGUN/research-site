    <script>
      // Light is the default. Apply a saved dark choice before first paint so the page does not flash.
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0D1310');
        }
      } catch (e) {}
    </script>
    <style>
      /* Paint the page background dark straight away, before the stylesheet loads, so moving between
         pages in dark mode never shows a flash of the light default. */
      html[data-theme='dark'] { background: #0d1310; color-scheme: dark; }
